name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag belongs to master
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          tag_commit=$(git rev-list -n 1 "$RELEASE_TAG")
          if [[ -z "$tag_commit" || "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked-out commit does not match $RELEASE_TAG." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/master; then
            echo "$RELEASE_TAG does not point to a commit reachable from master." >&2
            exit 1
          fi

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Validate native dependency manifest
        shell: bash
        run: ./eng/verify-native-manifest.sh

      - name: Build pinned Linux 7-Zip library
        shell: bash
        run: ./eng/build-native-7zip.sh artifacts/native/linux-x64

      - name: Restore
        run: dotnet restore Odyssey.slnx

      - name: Audit NuGet dependencies
        shell: bash
        run: |
          mkdir -p TestResults
          dotnet list Odyssey.slnx package --vulnerable --include-transitive --format json > TestResults/nuget-audit.json
          jq -e '[.. | objects | .vulnerabilities? // empty] | flatten | length == 0' TestResults/nuget-audit.json

      - name: Build
        run: dotnet build Odyssey.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:TreatWarningsAsErrors=true -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        env:
          ODYSSEY_7ZIP_LIBRARY: ${{ github.workspace }}/artifacts/native/linux-x64/7z.so
        run: >-
          dotnet test Odyssey.slnx --configuration Release --no-build --no-restore
          --blame-hang --blame-hang-timeout 5m
          --logger "trx;LogFileName=release-tests.trx"
          --results-directory TestResults

      - name: Repeat real stability scenarios
        shell: bash
        env:
          ODYSSEY_7ZIP_LIBRARY: ${{ github.workspace }}/artifacts/native/linux-x64/7z.so
        run: |
          for pass in 1 2 3; do
            dotnet test Odyssey.slnx --configuration Release --no-build --no-restore \
              --filter "Category=Stability" \
              --blame-hang --blame-hang-timeout 5m \
              --logger "trx;LogFileName=release-stability-${pass}.trx" \
              --results-directory TestResults
          done

      - name: Upload release test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-test-results
          path: TestResults/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified native assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-linux-x64
          path: artifacts/native/linux-x64
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package ${{ matrix.rid }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: Odyssey-win-x64.zip
            app: Odyssey.Desktop.exe
            updater: Odyssey.Updater.exe
            mcp: Odyssey.Mcp.exe
          - os: ubuntu-latest
            rid: linux-x64
            archive: Odyssey-linux-x64.tar.gz
            app: Odyssey.Desktop
            updater: Odyssey.Updater
            mcp: Odyssey.Mcp
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Download pinned native assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-linux-x64
          path: artifacts/native/linux-x64

      - name: Restore runtime projects
        shell: bash
        run: |
          dotnet restore src/Odyssey.Desktop/Odyssey.Desktop.csproj --runtime "${{ matrix.rid }}"
          dotnet restore src/Odyssey.Updater/Odyssey.Updater.csproj --runtime "${{ matrix.rid }}"
          dotnet restore src/Odyssey.Mcp/Odyssey.Mcp.csproj --runtime "${{ matrix.rid }}"

      - name: Publish Odyssey
        shell: bash
        run: |
          dotnet publish src/Odyssey.Desktop/Odyssey.Desktop.csproj \
            --configuration Release --runtime "${{ matrix.rid }}" --self-contained true \
            --no-restore \
            --output publish/app \
            -p:Version="${{ needs.validate.outputs.version }}" \
            -p:ContinuousIntegrationBuild=true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishReadyToRun=true \
            -p:DebugType=embedded

      - name: Publish update helper
        shell: bash
        run: |
          dotnet publish src/Odyssey.Updater/Odyssey.Updater.csproj \
            --configuration Release --runtime "${{ matrix.rid }}" --self-contained true \
            --no-restore \
            --output publish/updater \
            -p:Version="${{ needs.validate.outputs.version }}" \
            -p:ContinuousIntegrationBuild=true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishReadyToRun=true \
            -p:DebugType=embedded
          cp "publish/updater/${{ matrix.updater }}" "publish/app/${{ matrix.updater }}"
          dotnet publish src/Odyssey.Mcp/Odyssey.Mcp.csproj \
            --configuration Release --runtime "${{ matrix.rid }}" --self-contained true \
            --no-restore \
            --output publish/mcp \
            -p:Version="${{ needs.validate.outputs.version }}" \
            -p:ContinuousIntegrationBuild=true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishReadyToRun=true \
            -p:DebugType=embedded
          cp "publish/mcp/${{ matrix.mcp }}" "publish/app/${{ matrix.mcp }}"
          rm -f publish/app/*.pdb

      - name: Verify published executables
        shell: bash
        run: |
          test -s "publish/app/${{ matrix.app }}"
          test -s "publish/app/${{ matrix.updater }}"
          test -s "publish/app/${{ matrix.mcp }}"

      - name: Stage native libraries and licenses
        shell: bash
        run: ./eng/stage-native-assets.sh "${{ matrix.rid }}" publish/app artifacts/native/linux-x64

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/app/* -DestinationPath "${{ matrix.archive }}" -CompressionLevel Optimal
          if ((Get-Item "${{ matrix.archive }}").Length -le 0) { throw "Windows package is empty." }

      - name: Create Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -C publish/app -czf "${{ matrix.archive }}" .
          test -s "${{ matrix.archive }}"
          tar -tzf "${{ matrix.archive }}" >/dev/null

      - name: Upload platform package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.rid }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: [validate, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Download platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Verify downloaded packages
        shell: bash
        run: |
          test -s dist/Odyssey-win-x64.zip
          test -s dist/Odyssey-linux-x64.tar.gz
          unzip -tqq dist/Odyssey-win-x64.zip
          tar -tzf dist/Odyssey-linux-x64.tar.gz >/dev/null
          ./eng/verify-packaged-native-assets.sh win-x64 dist/Odyssey-win-x64.zip
          ./eng/verify-packaged-native-assets.sh linux-x64 dist/Odyssey-linux-x64.tar.gz

      - name: Create checksums and update manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cd dist
          windows_sha=$(sha256sum Odyssey-win-x64.zip | cut -d' ' -f1)
          linux_sha=$(sha256sum Odyssey-linux-x64.tar.gz | cut -d' ' -f1)
          sha256sum Odyssey-win-x64.zip Odyssey-linux-x64.tar.gz > checksums.txt
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg tag "$RELEASE_TAG" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg releaseNotesUrl "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            --arg winUrl "$base_url/Odyssey-win-x64.zip" \
            --arg winSha "$windows_sha" \
            --arg linuxUrl "$base_url/Odyssey-linux-x64.tar.gz" \
            --arg linuxSha "$linux_sha" \
            '{
              schemaVersion: 1,
              version: $version,
              tag: $tag,
              publishedAt: $publishedAt,
              releaseNotesUrl: $releaseNotesUrl,
              assets: {
                "win-x64": {
                  fileName: "Odyssey-win-x64.zip",
                  downloadUrl: $winUrl,
                  sha256: $winSha,
                  format: "zip"
                },
                "linux-x64": {
                  fileName: "Odyssey-linux-x64.tar.gz",
                  downloadUrl: $linuxUrl,
                  sha256: $linuxSha,
                  format: "tar.gz"
                }
              }
            }' > update-manifest.json

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .draft)
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $RELEASE_TAG already exists and is published." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "Odyssey $RELEASE_VERSION"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
