name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} · build and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Install Node.js for Monaco verification
        if: runner.os == 'Linux'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: src/Odyssey.Desktop/Monaco/package-lock.json

      - name: Audit and rebuild bundled Monaco assets
        if: runner.os == 'Linux'
        working-directory: src/Odyssey.Desktop/Monaco
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=low
          npm run build
          git diff --exit-code -- dist

      - name: Validate native dependency manifest
        shell: bash
        run: ./eng/verify-native-manifest.sh

      - name: Build pinned Linux 7-Zip library
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./eng/build-native-7zip.sh artifacts/native/linux-x64
          mkdir -p TestResults
          cp artifacts/native/linux-x64/7z.so.sha256 TestResults/native-linux-x64.sha256

      - name: Restore
        run: dotnet restore Odyssey.slnx

      - name: Audit NuGet dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p TestResults
          dotnet list Odyssey.slnx package --vulnerable --include-transitive --format json > TestResults/nuget-audit.json
          jq -e '[.. | objects | .vulnerabilities? // empty] | flatten | length == 0' TestResults/nuget-audit.json

      - name: Build
        run: dotnet build Odyssey.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:TreatWarningsAsErrors=true

      - name: Test
        env:
          ODYSSEY_7ZIP_LIBRARY: ${{ runner.os == 'Linux' && format('{0}/artifacts/native/linux-x64/7z.so', github.workspace) || '' }}
        run: >-
          dotnet test Odyssey.slnx --configuration Release --no-build --no-restore
          --collect "XPlat Code Coverage"
          --blame-hang --blame-hang-timeout 5m
          --logger "trx;LogFileName=tests-${{ runner.os }}.trx"
          --results-directory TestResults

      - name: Repeat real stability scenarios
        shell: bash
        env:
          ODYSSEY_7ZIP_LIBRARY: ${{ runner.os == 'Linux' && format('{0}/artifacts/native/linux-x64/7z.so', github.workspace) || '' }}
        run: |
          for pass in 1 2 3; do
            dotnet test Odyssey.slnx --configuration Release --no-build --no-restore \
              --filter "Category=Stability" \
              --blame-hang --blame-hang-timeout 5m \
              --logger "trx;LogFileName=stability-${{ runner.os }}-${pass}.trx" \
              --results-directory TestResults
          done

      - name: Run deterministic benchmark smoke profile
        env:
          ODYSSEY_BENCHMARK_COMMIT: ${{ github.sha }}
        run: >-
          dotnet run --project benchmarks/Odyssey.Benchmarks/Odyssey.Benchmarks.csproj
          --configuration Release --no-build --no-restore --
          --files 500 --rich-documents 10 --iterations 2 --transfer-mib 4
          --output TestResults/benchmark-${{ runner.os }}.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ runner.os }}
          path: TestResults/**
          if-no-files-found: warn
          retention-days: 14
